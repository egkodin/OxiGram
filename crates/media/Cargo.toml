[package]
name = "media"
description = "Voice capture and encoding, and video and audio decoding through FFmpeg"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cpal.workspace = true
ffmpeg-next.workspace = true
ogg.workspace = true
opus.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
# Links the FFmpeg that scripts/build-ffmpeg.sh builds statically, found
# through PKG_CONFIG_PATH=<prefix>/lib/pkgconfig, instead of the system's.
static-ffmpeg = ["ffmpeg-next/static"]

[lints]
workspace = true
