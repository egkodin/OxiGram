[package]
name = "oxigram-package"
description = "OxiGram release extraction and standalone executable launcher"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oxigram-launcher"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
flate2 = { workspace = true, features = ["zlib-rs"] }
tar = { version = "0.4.46", default-features = false }
tempfile.workspace = true
zip = { version = "9.8.1", default-features = false, features = ["deflate-flate2"] }

[lints]
workspace = true
