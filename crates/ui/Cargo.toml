[package]
name = "ui"
description = "rgram's widgets, drawn to tdesktop's styles"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
gpui.workspace = true
# The version gpui uses; only PNG decoding for icon masks.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# The version gpui uses; rasterizes tdesktop's SVG icon masks.
resvg = { version = "0.46.0", default-features = false }
qrcode = { version = "0.14.1", default-features = false }
style.workspace = true
thiserror.workspace = true
tracing.workspace = true
unicode-segmentation = "1.13.3"

[lints]
workspace = true
