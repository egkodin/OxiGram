name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: fmt, schema, dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --all --check
      - run: scripts/check-td-schema.sh
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-audit
      - run: cargo deny check
      - run: cargo audit
      # Informational: duplicated crates, most of them from gpui's tree.
      - run: cargo tree --workspace --duplicates --edges normal

  build:
    name: clippy, test, build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            tdlib_jobs: 2
          - os: ubuntu-24.04
            tdlib_jobs: 4
          - os: windows-2025
            tdlib_jobs: 4
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        # TDLib's build tools, plus the libraries gpui links (Zed's script/linux).
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gperf zlib1g-dev libssl-dev \
            libasound2-dev libfontconfig-dev libglib2.0-dev libva-dev libvulkan1 \
            libwayland-dev libx11-xcb-dev libxkbcommon-x11-dev libzstd-dev \
            meson nasm pkg-config
      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install gperf ninja openssl@3 meson pkgconf
      - name: Install system packages (Windows)
        if: runner.os == 'Windows'
        # `cygpath -m` gives C:/style paths that both bash and CMake accept.
        run: |
          vcpkg_root="$(cygpath -m "$VCPKG_INSTALLATION_ROOT")"
          echo "VCPKG_ROOT=$vcpkg_root" >> "$GITHUB_ENV"
          "$vcpkg_root/vcpkg.exe" install gperf:x64-windows openssl:x64-windows zlib:x64-windows
          "$vcpkg_root/vcpkg.exe" install 'ffmpeg[core,avcodec,avformat,swresample,swscale,vpx]:x64-windows'
          echo "$vcpkg_root/installed/x64-windows/bin" >> "$GITHUB_PATH"

      - name: Restore TDLib
        id: tdlib-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rgram
          key: tdlib-${{ runner.os }}-${{ hashFiles('tdlib/COMMIT', 'scripts/build-tdlib.sh') }}
      - name: Build TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        run: TD_BUILD_JOBS=${{ matrix.tdlib_jobs }} scripts/build-tdlib.sh
      # Saved right away, so a later failing step does not discard the build.
      - name: Save TDLib
        if: steps.tdlib-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rgram
          key: ${{ steps.tdlib-cache.outputs.cache-primary-key }}

      # The minimal static FFmpeg that `--all-features` links (media/static-ffmpeg).
      # Windows links the MSVC libraries installed by vcpkg.
      - name: Restore FFmpeg
        if: runner.os != 'Windows'
        id: ffmpeg-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rgram-ffmpeg
          key: ffmpeg-${{ runner.os }}-${{ hashFiles('ffmpeg/SOURCES', 'scripts/build-ffmpeg.sh') }}
      - name: Build FFmpeg
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: FFMPEG_BUILD_JOBS=4 scripts/build-ffmpeg.sh ~/.cache/rgram-ffmpeg
      - name: Save FFmpeg
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/rgram-ffmpeg
          key: ${{ steps.ffmpeg-cache.outputs.cache-primary-key }}
      - if: runner.os != 'Windows'
        run: |
          echo "PKG_CONFIG_PATH=$HOME/.cache/rgram-ffmpeg/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "FEATURES=--all-features" >> "$GITHUB_ENV"
      - if: runner.os == 'Windows'
        run: echo "FEATURES=--features oxigram/runtime-shaders" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
      # `--all-features` includes `runtime-shaders`, so macOS runners need no
      # Metal toolchain.
      - run: cargo clippy --locked --workspace --all-targets $FEATURES -- -D warnings
      - run: cargo test --locked --workspace $FEATURES
      - if: github.event_name != 'workflow_dispatch'
        run: cargo build --locked --workspace $FEATURES
      - name: Build and smoke-test the release archive
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            cargo build --locked --release -p oxigram --features runtime-shaders
          else
            cargo build --locked --release -p oxigram --features runtime-shaders,media/static-ffmpeg
          fi
          bash scripts/package-release.sh target/release dist
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          name: oxigram-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
      - run: cargo doc --locked --workspace $FEATURES --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
