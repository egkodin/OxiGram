[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
td-api = { path = "crates/td-api" }
td-api-gen = { path = "crates/td-api-gen" }
td-sys = { path = "crates/td-sys" }
tg = { path = "crates/tg" }
style = { path = "crates/style" }

# gpui is not published from Zed's tree; the pin moves only per ADR 0002.
gpui = { git = "https://github.com/zed-industries/zed", rev = "876c1b0c5fb0ed7c15703a1955ef4b3580bd73fa" }
# Without these features gpui silently falls back to a text system that draws
# nothing (macOS: font-kit; Linux: wayland/x11). Zed enables the same set.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "876c1b0c5fb0ed7c15703a1955ef4b3580bd73fa", features = ["font-kit", "wayland", "x11"] }

anyhow = "1.0.104"
futures = "0.3.34"
futures-channel = "0.3.34"
insta = "1.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tdlib-rs-parser = "1.4.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

[workspace.lints.rust]
# td-sys is the only crate allowed to opt out (ADR 0003).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
