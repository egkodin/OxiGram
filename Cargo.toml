[workspace]
resolver = "3"
members = ["crates/*", "tools/*"]
exclude = ["vendor"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace.dependencies]
td-api = { path = "crates/td-api" }
td-api-gen = { path = "crates/td-api-gen" }
td-sys = { path = "crates/td-sys" }
tg = { path = "crates/tg" }
style = { path = "crates/style" }
i18n = { path = "crates/i18n" }
model = { path = "crates/model" }
ui = { path = "crates/ui" }
features = { path = "crates/features" }

# gpui is not published from Zed's tree; the pin moves only per ADR 0002.
gpui = { git = "https://github.com/zed-industries/zed", rev = "876c1b0c5fb0ed7c15703a1955ef4b3580bd73fa" }
# Without these features gpui silently falls back to a text system that draws
# nothing (macOS: font-kit; Linux: wayland/x11). Zed enables the same set.
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "876c1b0c5fb0ed7c15703a1955ef4b3580bd73fa", features = ["font-kit", "wayland", "x11"] }

anyhow = "1.0.104"
# Already in the tree through gpui; decodes TDLib's `bytes` fields.
base64 = "0.22.1"
# Already in the tree through gpui; local time for chat list dates.
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures = "0.3.34"
futures-channel = "0.3.34"
# The version gpui uses, so `render_to_image` results can be saved.
image = { version = "0.25.10", default-features = false, features = ["png"] }
insta = "1.43"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tdlib-rs-parser = "1.4.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Zed's macOS backend with rgram's idle-CPU patch (ADR 0005). Regenerate it with
# scripts/vendor-gpui-macos.sh whenever the rev above moves.
[patch."https://github.com/zed-industries/zed"]
gpui_macos = { path = "vendor/gpui_macos" }

[workspace.lints.rust]
# td-sys is the only crate allowed to opt out (ADR 0003).
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
