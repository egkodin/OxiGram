# cargo deny check: licenses, advisories, bans and sources (run in CI).

[graph]
all-features = true

[advisories]
# Unmaintained crates fail only as direct dependencies. The ones below gpui
# (paste, rustybuzz, ttf-parser, zbus_names, zvariant) are Zed's to replace.
# `cargo audit` still reports them as warnings. Vulnerabilities fail everywhere.
unmaintained = "workspace"
ignore = []

[licenses]
# Everything oxigram links must be compatible with GPL-3.0-or-later (ADR 0001).
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# The FFmpeg bindings (ADR 0006): WTFPL is permissive and GPL-compatible
# (FSF list); allowed for them alone.
exceptions = [
    { allow = ["WTFPL"], crate = "ffmpeg-next" },
    { allow = ["WTFPL"], crate = "ffmpeg-sys-next" },
]

[licenses.private]
# oxigram's own crates are GPL-3.0-or-later and never published.
ignore = true

[bans]
# gpui pulls several duplicated crates; `cargo tree --duplicates` reports them in
# CI. Warn, and remove the ones that are ours to remove.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# gpui comes from Zed's tree (ADR 0002), which pins these forks and wgpu.
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/oo7",
    "https://github.com/zed-industries/wasm_thread",
    "https://github.com/zed-industries/xim-rs",
    "https://github.com/zed-industries/zed",
    # The Lottie renderer tdesktop uses, pinned by rev (ADR 0007).
    "https://github.com/dkaraush/tlottie",
]
